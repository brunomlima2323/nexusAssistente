# =====================================================================
#  Nexu - configuracoes padrao
#
#  Ordem de prioridade (a ultima vence):
#    1. este arquivo (dentro do jar)
#    2. ~/.nexu/application.properties
#    3. ./nexu.properties (pasta de onde o Nexu foi iniciado)
#    4. arquivo indicado em -Dnexu.config=/caminho/arquivo.properties
#    5. variaveis de ambiente NEXU_<CHAVE> (ex.: NEXU_WEATHER_DEFAULT_CITY)
#    6. propriedades de sistema -Dnexu.<chave>=valor
# =====================================================================

# ---------- Assistente ----------
assistant.greeting=Olá senhor, estou à sua disposição.
assistant.wake.response=Olá senhor, estou aqui. O que deseja?
assistant.farewell=Até logo, senhor. Foi um prazer ajudá-lo.
assistant.not.understood=Desculpe, senhor, não compreendi. Poderia repetir?
# Tempo (s) em que o Nexu continua aguardando comandos sem exigir a palavra de ativação
assistant.conversation.timeout.seconds=12
# Janela (ms) para descartar comandos duplicados vindos de transcricoes parecidas
assistant.dedup.window.millis=3000

# ---------- Palavra de ativacao ----------
wakeword.word=nexu
# Transcricoes que sao tratadas como "Nexu" diretamente
wakeword.aliases=nexu,nexus,nessu,nesu,neksu,necsu,nexum,nekso
# Palavras reais do portugues que so ativam com contexto favoravel (ex.: "anexo")
wakeword.contextual.words=anexo,anexos,anexu,nexo
# Palavras foneticamente proximas que nunca ativam
wakeword.blocklist=nesse,nessa,nesses,nessas,nisso,disso,desse,dessa,sexo,mexo,mexe,deixo,fixo,lixo,nexa
# Similaridade minima (0..1)
wakeword.threshold=0.82
wakeword.contextual.threshold=0.90

# ---------- Reconhecimento de voz (Vosk) ----------
# Baixe em https://alphacephei.com/vosk/models e descompacte nesta pasta
vosk.model.path=models/vosk-model-small-pt-0.3
audio.sample.rate=16000
# Parte do nome do microfone desejado (vazio = microfone padrao do sistema)
audio.input.device=
# Tempo (ms) que o microfone permanece ignorado apos o Nexu terminar de falar
audio.echo.guard.millis=700
# Janela (ms) para descartar transcricoes parecidas com a fala do proprio Nexu
audio.echo.window.millis=4000

# ---------- Sons ----------
audio.beep.count=3
# Caminho opcional para um .wav proprio (vazio = sounds/beep.wav interno)
audio.beep.file=

# ---------- Sintese de voz ----------
# auto | windows | macos | espeak | command | none
tts.engine=auto
# Windows (SAPI): parte do nome da voz (vazio = primeira voz pt-BR instalada, ex.: "Maria")
tts.voice=
tts.culture=pt-BR
# Windows: -10 (lento) a 10 (rapido)
tts.rate=0
tts.volume=100
# macOS
tts.mac.voice=Luciana
tts.mac.rate=185
# Linux (espeak-ng / espeak)
tts.espeak.voice=pt-br
tts.espeak.speed=160
# Motor externo (tts.engine=command). {text} e substituido pelo texto.
# Sem {text}, o texto e enviado pela entrada padrao. Ex.: piper-falar.sh {text}
tts.command=

# ---------- Previsao do tempo (Open-Meteo: gratuito, sem chave) ----------
# Cidade usada quando nenhuma for mencionada (vazio = detectar pela internet)
weather.default.city=
# Ou coordenadas fixas (tem prioridade sobre a deteccao automatica)
weather.default.latitude=
weather.default.longitude=
weather.preferred.country=BR
weather.api.forecast.url=https://api.open-meteo.com/v1/forecast
weather.api.geocoding.url=https://geocoding-api.open-meteo.com/v1/search
# Apenas para planos comerciais da Open-Meteo. Prefira NEXU_WEATHER_API_KEY.
weather.api.key=
weather.ip.location.enabled=true
weather.ip.location.primary.url=http://ip-api.com/json/?fields=status,message,city,lat,lon&lang=pt-BR
weather.ip.location.fallback.url=https://ipapi.co/json/
weather.http.timeout.seconds=10
weather.cache.minutes=10

# ---------- Cronometro ----------
timer.max.hours=24
timer.tick.millis=250

# ---------- Interface ----------
ui.bring.to.front.on.timer=true
ui.history.max=200
